<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3c5d"/>
      <stop offset="60%" stop-color="#07273d"/>
      <stop offset="100%" stop-color="#00b493"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="200" rx="12" fill="url(#bgGradient)"/>
  <circle cx="750" cy="20" r="100" fill="#00b493" opacity="0.15"/>
  <circle cx="780" cy="180" r="70" fill="#fbbf24" opacity="0.1"/>
  <circle cx="50" cy="190" r="80" fill="#00b493" opacity="0.2"/>

  <g transform="translate(60, 40)">
    <path d="M 60 5 Q 110 5 110 50 Q 110 95 60 115 Q 10 95 10 50 Q 10 5 60 5 Z" fill="#0b3c5d" stroke="url(#goldGradient)" stroke-width="4"/>
    <path d="M 40 45 L 80 45 L 75 75 L 45 75 Z" fill="none" stroke="#26d0ab" stroke-width="3"/>
    <path d="M 60 25 L 60 45" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="60" cy="22" r="6" fill="#fbbf24" filter="url(#glow)"/>
    <line x1="30" y1="85" x2="90" y2="85" stroke="#ffffff" stroke-width="2"/>
    <line x1="38" y1="92" x2="82" y2="92" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g transform="translate(200, 75)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      CITY UNIVERSITY
    </text>
    <text x="2" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#26d0ab" letter-spacing="3">
      EXCELLENCE IN EDUCATION &amp; INNOVATION
    </text>
    <text x="2" y="62" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Department of CSE &amp; Engineering | Batch 62
    </text>
  </g>

  <g transform="translate(670, 55)">
    <circle cx="45" cy="45" r="40" fill="rgba(0, 180, 147, 0.2)" stroke="#26d0ab" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="45" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">GRADE</text>
    <text x="45" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">A+</text>
  </g>
</svg>
